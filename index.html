<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K Anime - Stream Your Favorite Anime</title>
    <style>
        :root {
            --bg-color: #0f1015;
            --card-bg: #1a1c23;
            --accent-color: #e50914;
            --text-color: #ffffff;
            --text-muted: #9ca3af;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: rgba(26, 28, 35, 0.9);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #2d3139;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent-color);
            letter-spacing: 1px;
        }
        .search-container {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            padding: 10px 16px;
            border-radius: 6px;
            border: 1px solid #374151;
            background-color: #111827;
            color: var(--text-color);
            width: 280px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: var(--accent-color);
        }
        button {
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            background-color: var(--accent-color);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        main {
            flex: 1;
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }
        h2 {
            margin-bottom: 24px;
            font-size: 22px;
            font-weight: 600;
        }
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 24px;
        }
        .anime-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }
        .anime-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .anime-poster {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background-color: #2d3139;
        }
        .anime-info {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }
        .anime-title {
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .anime-sub {
            font-size: 13px;
            color: var(--text-muted);
        }
        .loader {
            text-align: center;
            padding: 50px;
            color: var(--text-muted);
            font-size: 18px;
            grid-column: 1 / -1;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            border-top: 1px solid #2d3139;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">K ANIME</div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search anime...">
            <button id="searchBtn">Search</button>
        </div>
    </header>

    <main>
        <h2>Trending & Popular</h2>
        <div id="animeGrid" class="anime-grid">
            <div class="loader">Loading amazing anime...</div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 K Anime. Built with passion, bro.</p>
    </footer>

    <script>
        // Replace this with your live Vercel backend URL once deployed, 
        // or test locally with your running backend API.
        const API_BASE_URL = "https://khaya833-source.vercel.app"; 

        async function fetchAnime(query = "") {
            const grid = document.getElementById("animeGrid");
            grid.innerHTML = '<div class="loader">Loading anime data...</div>';

            try {
                // If you have a specific endpoint on your backend, update it here:
                // e.g., `${API_BASE_URL}/anime/search?q=${query}` or `${API_BASE_URL}/home`
                const endpoint = query ? `${API_BASE_URL}/search?q=${encodeURIComponent(query)}` : `${API_BASE_URL}/home`;
                
                // Fallback demo layout if API is not yet live, ensuring zero blank crashes:
                // Once your backend is mapped, this fetches straight from your API endpoints.
                const response = await fetch(endpoint).catch(() => null);
                
                if (!response || !response.ok) {
                    // Fallback placeholder rendering so UI stays solid while you wire up your Vercel URL
                    renderPlaceholderContent();
                    return;
                }

                const data = await response.json();
                renderAnimeList(data.results || data);
            } catch (error) {
                console.error("Fetch error:", error);
                renderPlaceholderContent();
            }
        }

        function renderAnimeList(items) {
            const grid = document.getElementById("animeGrid");
            grid.innerHTML = "";

            if (!items || items.length === 0) {
                grid.innerHTML = '<div class="loader">No anime found.</div>';
                return;
            }

            items.forEach(anime => {
                const card = document.createElement("div");
                card.className = "anime-card";
                card.innerHTML = `
                    <img class="anime-poster" src="${anime.image || anime.poster || 'https://via.placeholder.com/200x280?text=K+Anime'}" alt="${anime.title}">
                    <div class="anime-info">
                        <div class="anime-title" title="${anime.title}">${anime.title}</div>
                        <div class="anime-sub">${anime.subOrDub || anime.type || 'Sub'}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function renderPlaceholderContent() {
            const grid = document.getElementById("animeGrid");
            // Placeholder representation showcasing the smooth dark-mode grid layout
            const placeholders = [
                { title: "Jujutsu Kaisen", type: "Sub | Episode 24" },
                { title: "Chainsaw Man", type: "Sub | Episode 12" },
                { title: "Attack on Titan", type: "Dub | Final" },
                { title: "Demon Slayer", type: "Sub | Movie" },
                { title: "Bleach: TYBW", type: "Sub | Cour 3" },
                { title: "Solo Leveling", type: "Sub | Season 1" }
            ];
            
            grid.innerHTML = "";
            placeholders.forEach(p => {
                const card = document.createElement("div");
                card.className = "anime-card";
                card.innerHTML = `
                    <div class="anime-poster" style="display:flex;align-items:center;justify-content:center;background:#222634;color:#525b75;font-weight:bold;">K-ANIME</div>
                    <div class="anime-info">
                        <div class="anime-title">${p.title}</div>
                        <div class="anime-sub">${p.type}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        document.getElementById("searchBtn").addEventListener("click", () => {
            const query = document.getElementById("searchInput").value;
            fetchAnime(query);
        });

        document.getElementById("searchInput").addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                fetchAnime(e.target.value);
            }
        });

        // Initial load
        fetchAnime();
    </script>
</body>
</html>
